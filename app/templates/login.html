{% extends "base.html" %}

{% block content %}
<div style="max-width: 400px; margin: 60px auto;">
    <div class="card">
        <h2 style="text-align: center; margin-bottom: 24px; color: #2c3e50;">🔐 用户登录</h2>
        
        <form method="POST" action="{{ url_for('auth.login') }}">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
            
            <div class="form-group">
                <label for="username">用户名</label>
                <input type="text" id="username" name="username" 
                       placeholder="请输入用户名" required autocomplete="username">
            </div>
            
            <div class="form-group">
                <label for="password">密码</label>
                <input type="password" id="password" name="password" 
                       placeholder="请输入密码" required autocomplete="current-password">
            </div>
            
            <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 8px;">
                登 录
            </button>
        </form>
        
        <div class="auth-link">
            还没有账户？<a href="{{ url_for('auth.register') }}">立即注册</a>
        </div>
    </div>
</div>
{% endblock %}
