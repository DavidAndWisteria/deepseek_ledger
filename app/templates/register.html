{% extends "base.html" %}

{% block content %}
<div class="auth-container">
    <div class="card">
        <h2 style="text-align: center; margin-bottom: 24px; color: #1a1a2e;">📝 注册新账户</h2>
        
        <form method="POST" action="{{ url_for('auth.register') }}">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
            
            <div class="form-group">
                <label for="family_name">家庭名称 *</label>
                <input type="text" id="family_name" name="family_name" 
                       placeholder="例如：张家、李家" required>
            </div>
            
            <div class="form-group">
                <label for="owner_name">你的称呼 *</label>
                <input type="text" id="owner_name" name="owner_name" 
                       placeholder="例如：爸爸、妈妈、小明" required>
            </div>
            
            <div class="form-row">
                <div class="form-group">
                    <label for="username">用户名 *</label>
                    <input type="text" id="username" name="username" 
                           placeholder="字母数字下划线" 
                           required pattern="[a-zA-Z0-9_]{3,80}">
                </div>
                
                <div class="form-group">
                    <label for="role">角色 *</label>
                    <select id="role" name="role" required>
                        <option value="ADULT">👨‍👩‍👧 成人（可看全家数据）</option>
                        <option value="CHILD">👶 小孩（只看自己数据）</option>
                    </select>
                </div>
            </div>
            
            <div class="form-group">
                <label for="password">密码 *</label>
                <input type="password" id="password" name="password" 
                       placeholder="至少8个字符" required minlength="8">
            </div>
            
            <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 8px; padding: 12px;">
                注 册
            </button>
        </form>
        
        <div style="text-align: center; margin-top: 16px; font-size: 14px; color: #888;">
            已有账户？<a href="{{ url_for('auth.login') }}" style="color: #e94560;">立即登录</a>
        </div>
    </div>
</div>
{% endblock %}
